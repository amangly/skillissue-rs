[package]
name = "skillissue-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
default-run = "skillissue"
description = "skillissue native Windows meeting workspace and overlay"

[features]
default = ["native-effects"]
native-effects = ["dep:gpui-review-platform", "dep:image"]
ui-review = ["native-effects"]

[[bin]]
name = "skillissue"
path = "src/main.rs"

[dependencies]
gpui-kit = "=0.7.3"
gpui-review-platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["test-support"], optional = true }
skillissue-core.workspace = true
skillissue-domain.workspace = true
skillissue-platform.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde.workspace = true
serde_json.workspace = true
raw-window-handle = "0.6"
anyhow = "1"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png"], optional = true }

