[package]
name = "skillissue-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "UI-independent capture, provider and durable session engine for skillissue"
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
skillissue-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart", "stream"] }
tokio = { version = "1", features = ["sync", "time", "rt", "rt-multi-thread", "macros", "net", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
url = "2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
hound = "3.5"
earshot = "=1.2.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rusqlite = { version = "0.40", features = ["bundled"] }
pdf-extract = "0.12.1"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
quick-xml = "0.38.4"
sha2 = "0.10"
semver = "1"

[dev-dependencies]
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }

[target.'cfg(windows)'.dependencies]
wasapi = "0.26"
windows = { version = "0.62", features = ["Win32_Media_Audio"] }
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Registry", "Win32_Security"] }
