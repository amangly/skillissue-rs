[package]
name = "skillissue-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Native window, tray, and keyboard integration for skillissue"

[dependencies]
global-hotkey.workspace = true
skillissue-domain.workspace = true

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "=0.25.1", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_UI_WindowsAndMessaging"] }
